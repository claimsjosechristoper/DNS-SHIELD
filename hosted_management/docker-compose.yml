version: '3.8'

services:
  control-plane:
    build:
      context: ..
      dockerfile: hosted_management/Dockerfile
    container_name: dnsshield-hosted-api
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - hosted_data:/app/hosted_management

volumes:
  hosted_data:
